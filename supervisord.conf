[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:adk_api_server]
command=adk api_server --port 3000 --host 0.0.0.0
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/adk_api_error.log
stdout_logfile=/var/log/supervisor/adk_api_output.log
environment=HOME="/app"

[program:web_app]
command=python improved_app.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/web_app_error.log
stdout_logfile=/var/log/supervisor/web_app_output.log
environment=HOME="/app",PORT="8080"
